<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习任务清单</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #fdf2f8);
      color: #1f2937;
    }
    .app {
      width: min(92vw, 560px);
      background: white;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, .12);
    }
    h1 { margin: 0 0 6px; }
    .hint { margin: 0 0 22px; color: #64748b; }
    form { display: flex; gap: 10px; }
    input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      background: #4f46e5;
      color: white;
      font-weight: 700;
    }
    ul { padding: 0; margin: 22px 0 0; list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 4px;
      border-bottom: 1px solid #e2e8f0;
    }
    li span { flex: 1; }
    li.done span { color: #94a3b8; text-decoration: line-through; }
    .delete { background: #ef4444; padding: 7px 10px; }
    .empty { color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <main class="app">
    <h1>📚 学习任务清单</h1>
    <p class="hint">每天完成一点点，就是很大的进步。</p>
    <form id="task-form">
      <input id="task-input" placeholder="例如：学习 GitHub 30 分钟" required>
      <button>添加</button>
    </form>
    <ul id="task-list"></ul>
  </main>

  <script>
    const form = document.querySelector('#task-form');
    const input = document.querySelector('#task-input');
    const list = document.querySelector('#task-list');
    let tasks = JSON.parse(localStorage.getItem('studyTasks') || '[]');

    function save() {
      localStorage.setItem('studyTasks', JSON.stringify(tasks));
    }

    function render() {
      list.innerHTML = '';
      if (!tasks.length) {
        list.innerHTML = '<li class="empty">还没有任务，先添加一个吧。</li>';
        return;
      }

      tasks.forEach((task, index) => {
        const item = document.createElement('li');
        if (task.done) item.classList.add('done');
        item.innerHTML = `
          <input type="checkbox" ${task.done ? 'checked' : ''}>
          <span></span>
          <button class="delete">删除</button>
        `;
        item.querySelector('span').textContent = task.text;
        item.querySelector('input').addEventListener('change', () => {
          tasks[index].done = !tasks[index].done;
          save();
          render();
        });
        item.querySelector('.delete').addEventListener('click', () => {
          tasks.splice(index, 1);
          save();
          render();
        });
        list.appendChild(item);
      });
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      tasks.push({ text: input.value.trim(), done: false });
      input.value = '';
      save();
      render();
    });

    render();
  </script>
</body>
</html>
